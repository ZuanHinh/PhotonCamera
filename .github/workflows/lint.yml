name: Lint API 28
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/lint.yml"
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew && ./gradlew lintDefaultDebug --continue
        continue-on-error: true
      - name: Summary
        run: find app/build -name "lint-results*.txt" -exec grep -hE "\[(NewApi|InlinedApi)\]" {} + | sort -u
