name: Debug APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      flavor:
        description: Product flavor (default, samsung, meitu, google, dev)
        default: default
        required: true

permissions:
  contents: read

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FLAVOR: ${{ github.event.inputs.flavor || 'default' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ndk=$(grep -oP 'ndkVersion\s*=\s*"\K[^"]+' app/build.gradle.kts)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk" "cmake;3.22.1" > /dev/null

      - name: Build debug APK
        run: |
          chmod +x gradlew
          variant="$(tr '[:lower:]' '[:upper:]' <<< "${FLAVOR:0:1}")${FLAVOR:1}"
          ./gradlew ":app:assemble${variant}Debug" --console=plain --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotonCamera-${{ env.FLAVOR }}-debug-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
